<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempuh — Dashboard</title>
<meta name="description" content="Tempuh: dashboard lari, jalan kaki, jogging, dan sepeda. Created by KangAIs.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="loading" class="auth"><p class="muted">Memuat…</p></div>

<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="brand">
      <img src="icon.svg" width="44" height="44" alt="">
      <span class="brand-name">Tempuh</span>
    </div>
    <h1 id="auth-title">Masuk</h1>
    <p class="lead" id="auth-lead">Lihat dashboard dan riwayat aktivitas Anda.</p>
    <p class="msg err" id="auth-msg" hidden></p>
    <form id="auth-form" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="auth-name">Nama</label>
        <input id="auth-name" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="auth-pass">Kata sandi</label>
        <input id="auth-pass" name="password" type="password" autocomplete="current-password" minlength="8" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="auth-submit">Masuk</button>
    </form>
    <p class="switch"><span id="switch-text">Belum punya akun?</span> <button type="button" id="auth-switch">Daftar</button></p>
  </div>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard" style="text-decoration:none;color:inherit">
        <img src="icon.svg" width="34" height="34" alt="">
        <span class="brand-name" style="font-size:22px">Tempuh</span>
      </a>
      <nav class="nav" aria-label="Menu utama">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/riwayat" data-route="riwayat">Riwayat</a>
        <a href="#/upload" data-route="upload">Upload Garmin</a>
      </nav>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost" id="logout" type="button">Keluar</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer>Tempuh · Created by KangAIs</footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
